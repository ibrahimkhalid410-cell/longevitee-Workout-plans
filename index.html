<style>
/* Layout: a sticky filter strip on top (like a sheet header), a grid of plans under it, one detail sheet that opens over the page. */
:root {
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --ink: #12202B;
  --muted: #566672;
  --line: #D5DCE3;
  --accent: #1D4ED8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EBFD;
  --chip: #E3E8ED;
  --shade: rgba(10, 20, 30, .45);
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Inter", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D141B; --surface: #16202A; --ink: #E8EEF3; --muted: #93A3B1; --line: #28343F;
    --accent: #8AA9FF; --accent-ink: #0D141B; --accent-soft: #1B2A4A; --chip: #202C37; --shade: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D141B; --surface: #16202A; --ink: #E8EEF3; --muted: #93A3B1; --line: #28343F;
  --accent: #8AA9FF; --accent-ink: #0D141B; --accent-soft: #1B2A4A; --chip: #202C37; --shade: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 1080px; margin: 0 auto; }
header.top { padding-block: 28px 18px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .14em; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 5vw, 38px); line-height: 1.25; margin: 4px 0 6px; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); max-width: 60ch; }

.filters {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; display: grid; gap: 10px;
}
@media (min-width: 760px) {
  .filters { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 20; }
}
.frow { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 10px; min-width: 0; }
.flabel { font-weight: 700; font-size: 14px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 2px; min-width: 0; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  font: inherit; font-size: 15px; font-weight: 500; white-space: nowrap; cursor: pointer;
  background: var(--chip); color: var(--ink); border: 1px solid transparent;
  border-radius: 999px; padding: 5px 15px; min-height: 36px;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chip .st { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; margin-left: 7px; opacity: .9; }
.chip.ready { background: var(--accent-soft); color: var(--accent); font-weight: 600; border-color: var(--accent); }
.chip.ready[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip.soon { color: var(--muted); }
.chip.soon[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--ink); font-weight: 700; }
.soonbox { grid-column: 1 / -1; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 28px 20px; text-align: center; }
.soonbox h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0 0 4px; }
.soonbox p { margin: 0; color: var(--muted); }
.chip:focus-visible, .card:focus-visible, .tab:focus-visible, .close:focus-visible, .reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 18px 2px 12px; flex-wrap: wrap; }
.count { font-weight: 700; }
.reset { font: inherit; font-size: 14px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 6px; text-decoration: underline; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.card {
  text-align: left; font: inherit; color: inherit; cursor: pointer; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.card:hover { border-color: var(--accent); }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: 25px; letter-spacing: .01em; line-height: 1.3; margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 13px; font-weight: 500; background: var(--chip); border-radius: 6px; padding: 1px 9px; }
.tag.lv { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.meta { color: var(--muted); font-size: 15px; display: grid; gap: 2px; }
.meta b { color: var(--ink); font-weight: 700; }
.num { font-variant-numeric: tabular-nums; display: inline-block; }

.overlay { position: fixed; inset: 0; z-index: 40; background: var(--shade); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 760px) { .overlay { align-items: center; padding: 24px; } }
.sheet {
  background: var(--surface); width: 100%; max-width: 860px; max-height: 92%; overflow-y: auto;
  border-radius: 16px 16px 0 0; padding: 20px max(16px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
  min-width: 0;
}
@media (min-width: 760px) { .sheet { border-radius: 16px; padding: 24px 28px; max-height: 100%; } }
.sh-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sh-head h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(21px, 4vw, 28px); line-height: 1.3; margin: 0 0 8px; }
.close { font: inherit; font-size: 15px; font-weight: 700; background: var(--chip); color: var(--ink); border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer; min-height: 36px; flex: none; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 15px; margin-top: 10px; }
.facts b { color: var(--ink); }
.tabs { display: flex; gap: 6px; margin: 18px 0 12px; overflow-x: auto; padding-bottom: 2px; }
.tab { font: inherit; font-size: 15px; font-weight: 500; white-space: nowrap; cursor: pointer; background: var(--chip); color: var(--ink); border: 0; border-radius: 8px; padding: 6px 14px; min-height: 38px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.warm { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: 15px; margin-bottom: 12px; }
.tscroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; min-width: 520px; font-size: 15px; }
th { background: var(--chip); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; text-align: center; padding: 8px 6px; white-space: nowrap; }
th:nth-child(2), td:nth-child(2) { text-align: left; }
td { padding: 10px 6px; text-align: center; border-top: 1px solid var(--line); vertical-align: top; }
td.n { color: var(--muted); width: 28px; }
td.ex { font-weight: 600; text-align: left; min-width: 190px; }
.grp { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 1px; }
.about { color: var(--ink); font-size: 15px; }
.daynote { font-size: 14.5px; color: var(--muted); margin: -2px 2px 10px; }
td.cardio { text-align: left; }
td.cardio span { color: var(--muted); font-size: 14px; display: block; }
.legend { color: var(--muted); font-size: 13.5px; margin: 8px 2px 0; }
.notes { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.notes li { font-size: 15px; padding-left: 16px; position: relative; }
.notes li::before { content: ""; position: absolute; left: 0; top: .7em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .18s ease-out; } }
@keyframes rise { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }
</style>

</div>

<div class="overlay" id="overlay" hidden>

</div>

const FILTERS = [
  { key: "gender", label: "Gender", opts: [["all","All"],["men","Men"],["women","Women"]] },
  { key: "level",  label: "Level",  opts: [["all","All"],["beg","Beginner"],["int","Intermediate"],["adv","Advanced"]] },
  { key: "place",  label: "Place",  opts: [["all","All"],["gym","Gym"],["home","Home"]] },
  { key: "goal",   label: "Goal",   opts: [["all","All ready plans"],["health","General Health",1],["fat","Fat Loss",1],["strength","Strength",1],["hyp","Muscle Gain",0],["shape","Body Shape",0],["athletic","Athletic",0],["endurance","Endurance",0],["stress","Stress Relief",0],["classic","Classic",0],["ppl","Push / Pull / Legs",0],["powerlifting","Powerlifting",0],["programs","Other Programs",0]] }
];
const GOAL_TITLE = {};
const LABEL = {}; FILTERS.forEach(f => f.opts.forEach(([v, t]) => LABEL[f.key + ":" + v] = t));
const READY = new Set(["health", "fat", "strength"]);
const state = { gender: "all", level: "all", place: "all", goal: "all" };
const $ = id => document.getElementById(id);
let lastFocus = null;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function buildFilters() {
  $("filters").innerHTML = FILTERS.map(f =>
    `<div class="frow"><div class="flabel">${f.label}</div><div class="chips" data-key="${f.key}">` +
    f.opts.map(([v, t, rd]) => `<button type="button" class="chip${rd === 1 ? " ready" : rd === 0 ? " soon" : ""}" data-v="${v}" aria-pressed="${state[f.key] === v}">${t}${rd === 1 ? `<span class="st">Ready</span>` : ""}</button>`).join("") +
    `</div></div>`).join("");
}
function matches(p) { return FILTERS.every(f => state[f.key] === "all" || p[f.key] === state[f.key]); }
const soonGoal = () => state.goal !== "all" && !READY.has(state.goal);

function renderGrid() {
  const list = soonGoal() ? [] : PLANS.filter(matches);
  $("count").textContent = list.length + " of " + PLANS.length + " plans";
  $("reset").hidden = FILTERS.every(f => state[f.key] === "all");
  if (soonGoal()) {
    $("count").textContent = "Under construction";
    $("grid").innerHTML = `<div class="soonbox"><h2>${esc(LABEL["goal:" + state.goal])}</h2><p>This plan group is still being put together. Only the names are listed for now.</p></div>`;
    return;
  }
  $("grid").innerHTML = list.map(p => `
    <button type="button" class="card" data-id="${p.id}">
      <h2>${esc(LABEL["goal:" + p.goal])}</h2>
      <div class="tags">
        <span class="tag lv">${esc(LABEL["level:" + p.level])}</span>
        <span class="tag">${esc(LABEL["place:" + p.place])}</span>
        <span class="tag">${esc(LABEL["gender:" + p.gender])}</span>
      </div>
      <div class="meta">
        <div class="about">${esc(p.about)}</div>
        <div><b><span class="num">${p.daysCount}</span> days / week</b> · ${esc(p.split)}</div>
        <div>Main lifts: <span class="num">${esc(p.summary)}</span></div>
      </div>
    </button>`).join("");
}

function tempoCell(t) { return `<span class="num">${esc(t)}</span>`; }

function renderSheet(p, dayIdx) {
  const d = p.days[dayIdx];
  const rows = d.items.map((it, i) => it.cardio
    ? `<tr><td class="n">${i + 1}</td><td class="cardio" colspan="4"><b>${esc(it.ex)}</b><span>${esc(it.note)}</span></td></tr>`
    : `<tr><td class="n">${i + 1}</td><td class="ex">${it.grp ? `<span class="grp">${esc(it.grp)}</span>` : ""}${esc(it.ex)}</td><td><span class="num">${it.sets}</span></td><td>${esc(it.reps)}</td><td>${tempoCell(it.tempo)}</td><td><span class="num">${it.rest}</span> s</td></tr>`
  ).join("");
  $("sheet").innerHTML = `
    <div class="sh-head">
      <div>
        <h2 id="sh-title">${esc(p.title)}</h2>
        <div class="tags"><span class="tag lv">${esc(LABEL["level:" + p.level])}</span><span class="tag">${esc(LABEL["place:" + p.place])}</span><span class="tag">${esc(LABEL["gender:" + p.gender])}</span></div>
        <p class="about" style="margin:10px 0 0">${esc(p.about)}</p>
      </div>
      <button class="close" id="close" type="button">Close</button>
    </div>
    <div class="facts">
      <span><b><span class="num">${p.daysCount}</span> days</b> per week</span>
      <span>Length <b><span class="num">${p.weeks}</span> weeks</b></span>
      <span>Split <b>${esc(p.split)}</b></span>
      <span>Equipment <b>${esc(p.equipment)}</b></span>
    </div>
    <div class="tabs" role="tablist">${p.days.map((x, i) => `<button type="button" role="tab" class="tab" data-i="${i}" aria-selected="${i === dayIdx}">${esc(x.title)}</button>`).join("")}</div>
    <div class="warm"><b>Warm-up:</b> ${esc(d.warm)}</div>${d.note ? `<div class="daynote">${esc(d.note)}</div>` : ""}
    <div class="tscroll"><table>
      <thead><tr><th>#</th><th>Exercise</th><th>Sets</th><th>Reps</th><th>Tempo</th><th>Rest</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="legend">Tempo in seconds: lowering – pause at bottom – lifting – pause at top. Example <span class="num">3-1-1-0</span> = 3 s down, 1 s pause, 1 s up.</div>
    <ul class="notes">${p.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>`;
}

function openPlan(id, trigger) {
  const p = PLANS.find(x => x.id === id); if (!p) return;
  lastFocus = trigger || null;
  renderSheet(p, 0);
  $("sheet").dataset.id = id;
  $("overlay").hidden = false;
  document.body.style.overflow = "hidden";
  $("close").focus();
}
function closePlan() {
  $("overlay").hidden = true;
  document.body.style.overflow = "";
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

$("filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state[b.parentElement.dataset.key] = b.dataset.v;
  buildFilters(); renderGrid();
  try { localStorage.setItem("lg-filters", JSON.stringify(state)); } catch (_) {}
});
$("reset").addEventListener("click", () => {
  FILTERS.forEach(f => state[f.key] = "all"); buildFilters(); renderGrid();
  try { localStorage.removeItem("lg-filters"); } catch (_) {}
});
$("grid").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) openPlan(c.dataset.id, c); });
$("overlay").addEventListener("click", e => {
  if (e.target.id === "overlay" || e.target.id === "close") return closePlan();
  const t = e.target.closest(".tab");
  if (t) { const p = PLANS.find(x => x.id === $("sheet").dataset.id); renderSheet(p, +t.dataset.i); const tb = $("sheet").querySelector('.tab[aria-selected="true"]'); if (tb) tb.focus(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("overlay").hidden) closePlan(); });

try {
  const saved = JSON.parse(localStorage.getItem("lg-filters") || "null");
  if (saved) FILTERS.forEach(f => { if (f.opts.some(o => o[0] === saved[f.key])) state[f.key] = saved[f.key]; });
} catch (_) {}
buildFilters(); renderGrid();
</script>
